name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          ls -la
          test -f project.zip || { echo "project.zip is missing from this repo"; exit 1; }
          unzip -o project.zip -x ".github/*"
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BobsIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BobsIPTV
          path: BobsIPTV.apk

      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest BobsIPTV.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Automated build of ${GITHUB_SHA::7}"
            
    
      
