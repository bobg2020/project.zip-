      - name: Unpack project.zip
        run: |
          if [ -f project.zip ] && [ ! -d app ]; then
            unzip -o project.zip -x ".github/*"
            rm project.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack project"
            git push
          fi
