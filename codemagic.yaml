workflows:
  android:
    name: Bobs IPTV
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Unpack project
        script: |
          unzip -o project.zip -d src_proj
      - name: Build debug APK
        script: |
          cd src_proj
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o g.zip
          unzip -q g.zip
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace
    artifacts:
      - src_proj/app/build/outputs/apk/debug/*.apk
